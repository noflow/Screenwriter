<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import diagnostic</title>
<style>
  body{background:#241826;color:#EDE4D3;font:14px/1.6 ui-monospace,monospace;margin:0;padding:26px;max-width:820px}
  h1{font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:#C9A227;margin:0 0 4px}
  .sub{color:#938599;font-size:11px;margin-bottom:22px}
  .zone{border:2px dashed #4C3355;border-radius:6px;padding:34px;text-align:center;margin-bottom:16px;
    transition:border-color .15s,background .15s}
  .zone.hot{border-color:#C9A227;background:rgba(201,162,39,.08)}
  button{background:#402B49;color:#EDE4D3;border:1px solid #4C3355;border-radius:4px;padding:9px 15px;
    font:inherit;cursor:pointer;margin-right:8px}
  button:hover{border-color:#C9A227}
  .row{padding:7px 11px;border-left:3px solid #4C3355;background:#2e1f34;margin-bottom:4px;border-radius:0 3px 3px 0}
  .ok{border-left-color:#8FB08A}.bad{border-left-color:#C4778E}.warn{border-left-color:#C9A227}
  .k{color:#938599}
  pre{background:#1c1220;padding:11px;border-radius:4px;overflow-x:auto;font-size:11px;color:#938599;
    max-height:190px;white-space:pre-wrap;word-break:break-all}
  h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#C9A227;margin:26px 0 9px}
</style>

<h1>Import diagnostic</h1>
<div class="sub">Tells you exactly where the .character import is failing.</div>

<h2>1 · Environment</h2>
<div id="env"></div>

<h2>2 · Load a file</h2>
<div class="zone" id="zone">Drop a <b>.character</b> file here<br><br>
  <button id="pick">Choose file…</button>
  <button id="pickAll">Choose file (no filter)</button>
</div>
<div id="result"></div>

<script>
const $=id=>document.getElementById(id);
const row=(cls,label,val)=>'<div class="row '+cls+'"><span class="k">'+label+':</span> '+val+'</div>';

// ---- environment checks
let env='';
env+=row('ok','Page URL',location.href);
env+=row(location.protocol==='file:'?'warn':'ok','Protocol',location.protocol+
  (location.protocol==='file:'?' — serve over http instead: python -m http.server 8000':''));
env+=row(window.self!==window.top?'bad':'ok','Frame',
  window.self!==window.top?'RUNNING IN AN IFRAME — this is a sandboxed preview, downloads and storage are blocked'
  :'top-level window (correct)');
try{localStorage.setItem('_t','1');localStorage.removeItem('_t');
  env+=row('ok','localStorage','works');}
catch(e){env+=row('bad','localStorage','BLOCKED — '+e.message);}
env+=row(window.FileReader&&window.File?'ok':'bad','File API',
  window.FileReader&&window.File?'available':'MISSING');
env+=row('ok','Browser',navigator.userAgent.slice(0,90));
$('env').innerHTML=env;

// ---- inspect whatever we're given
async function inspect(f){
  let out='';
  out+=row('ok','File name',f.name);
  out+=row('ok','Reported size',f.size+' bytes');
  out+=row(f.size===0?'bad':'ok','Readable',f.size===0?'FILE IS EMPTY':'yes');

  const dot=f.name.lastIndexOf('.');
  const ext=dot>=0?f.name.slice(dot):'(none)';
  out+=row(ext==='.character'||ext==='.json'?'ok':'warn','Extension',ext+
    (ext==='.txt'?' — Windows added .txt. Rename it and turn on "File name extensions" in Explorer\'s View tab.':''));

  let text;
  try{ text=await f.text(); }
  catch(e){ $('result').innerHTML=out+row('bad','Read','FAILED — '+e.message); return; }

  out+=row('ok','Characters read',text.length);
  const bom=text.charCodeAt(0)===0xFEFF;
  if(bom)out+=row('warn','Byte order mark','present — stripping it before parse');
  const clean=bom?text.slice(1):text;

  const smart=/[\u2018\u2019\u201C\u201D]/.test(clean);
  if(smart)out+=row('warn','Smart quotes','found — a text editor replaced straight quotes, which breaks JSON');

  let data;
  try{ data=JSON.parse(clean); out+=row('ok','JSON parse','valid'); }
  catch(e){
    out+=row('bad','JSON parse','FAILED — '+e.message);
    const m=/position (\d+)/.exec(e.message);
    if(m){const p=+m[1];
      out+=row('bad','Around the problem','…'+clean.slice(Math.max(0,p-60),p+60).replace(/[<>]/g,'')+'…');}
    $('result').innerHTML=out+'<h2>First 400 characters</h2><pre>'+
      clean.slice(0,400).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</pre>';
    return;
  }

  out+=row('ok','Top-level type',Array.isArray(data)?'array':typeof data);
  out+=row(data.id?'ok':'bad','id',data.id||'MISSING');
  out+=row(data.display_name?'ok':'warn','display_name',data.display_name||'missing');
  out+=row(data.profile?'ok':'warn','profile',data.profile?'present':'missing');
  out+=row(data.schedule?'ok':'warn','schedule',
    data.schedule?(data.schedule.fixed_commitments||[]).length+' commitments':'missing');
  out+=row(data.boundaries?'ok':'warn','boundaries',
    data.boundaries?(data.boundaries.hard_limits||[]).length+' hard limits':'missing');

  const verdict=(data.id||data.display_name)
    ? row('ok','VERDICT','This file will import into Scenewright.')
    : row('bad','VERDICT','Valid JSON but no id or display_name — Scenewright will reject it.');

  $('result').innerHTML=out+verdict+'<h2>Keys found</h2><pre>'+
    Object.keys(data).join('\n')+'</pre>';
}

// ---- pickers
$('pick').onclick=()=>{
  const i=Object.assign(document.createElement('input'),{type:'file',accept:'.character,.json'});
  i.onchange=()=>i.files[0]?inspect(i.files[0])
    :$('result').innerHTML=row('bad','Picker','No file came back. If the folder looked empty, '+
      'the .character filter is hiding them — use the no-filter button.');
  i.click();
};
$('pickAll').onclick=()=>{
  const i=Object.assign(document.createElement('input'),{type:'file'});
  i.onchange=()=>i.files[0]&&inspect(i.files[0]);
  i.click();
};

const z=$('zone');
['dragenter','dragover'].forEach(e=>z.addEventListener(e,ev=>{
  ev.preventDefault();z.classList.add('hot');}));
['dragleave','drop'].forEach(e=>z.addEventListener(e,ev=>{
  ev.preventDefault();z.classList.remove('hot');}));
z.addEventListener('drop',ev=>{
  const f=ev.dataTransfer?.files?.[0];
  f?inspect(f):$('result').innerHTML=row('bad','Drop',
    'No file in the drop. You may have dragged a shortcut, or dragged from a zip that was never extracted.');
});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>e.preventDefault());
</script>
